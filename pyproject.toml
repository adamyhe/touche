[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ep-touche"
version = "0.1.1"
description = "Tools for preprocessing and analyzing high-resolution chromatin contact data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam He" }]
dependencies = [
  "numpy>=1.24",
  "polars>=1.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "tqdm>=4.65",
  "numba>=0.59",
]

[project.optional-dependencies]
legacy = ["statsmodels>=0.14"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
touche = "touche.cli:main"

[project.urls]
Homepage = "https://github.com/adamyhe/touche"
Repository = "https://github.com/adamyhe/touche"
Issues = "https://github.com/adamyhe/touche/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/touche"]

[tool.ruff]
line-length = 100
target-version = "py310"
